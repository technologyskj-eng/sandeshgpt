<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandesh Artificial Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.3/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    /* Splash screen styling */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #10b981; /* Green theme */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 50;
      color: white;
      font-family: 'Poppins', sans-serif;
    }
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body class="bg-blue-100 flex flex-col min-h-screen">
  <!-- Splash Screen -->
  <div id="splash">
    <h1 class="text-3xl md:text-5xl font-bold mb-2">Sandesh Artificial Intelligence</h1>
    <p class="text-lg loading-dots">Loading</p>
  </div>

  <!-- Chat UI -->
  <div id="chatSection" class="hidden flex flex-col min-h-screen">
    <div class="flex-grow container mx-auto py-6 px-4">
      <div class="h-full w-full max-w-2xl mx-auto">
        <div id="chatbox" class="flex flex-col items-start overflow-y-auto h-full p-1 rounded"></div>
      </div>
    </div>
    <div class="sticky bottom-0 w-full">
      <div class="flex justify-center">
        <div class="px-2 w-full max-w-2xl">
          <div class="flex flex-col my-5">
            <input
              class="shadow flex-grow rounded p-2 mb-2 border w-full text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              id="messageInput"
              type="text"
              placeholder="Ask Sandesh GPT"
            />
            <div class="flex justify-between space-x-2">
              <button
                class="bg-red-500 hover:bg-red-400 text-white font-bold py-2 px-4 border-b-4 border-red-700 hover:border-red-500 rounded w-full sm:w-auto"
                id="clearButton"
              >
                Clear Chat
              </button>
              <button
                class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-4 border-b-4 border-blue-700 hover:border-blue-500 rounded w-full sm:w-auto"
                id="sendButton"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Splash logic
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('chatSection').classList.remove('hidden');
    }, 3000);

    // Chat logic
    const chatbox = document.getElementById("chatbox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const chatId = crypto.randomUUID();
    let websocket = null;
    let receiving = false;

    const systemPrompt = "You are Sandesh AI, an advanced AI assistant designed to understand, reason, and respond to all kinds of questions — educational, technical, creative, or logical. Your goal is to help users by solving their problems clearly, step by step, and explaining answers in a simple, human-like way.";

    function createMessageElement(text, alignment) {
      const messageElement = document.createElement("div");
      messageElement.className = `inline-block my-2.5 p-2.5 rounded border ${
        alignment === "left" ? "self-start bg-white" : "self-end bg-blue-200"
      }`;
      messageElement.textContent = text;
      return messageElement;
    }

    function connectWebSocket(message, initChat) {
      receiving = true;
      sendButton.textContent = "Cancel";
      const url = "wss://backend.buildpicoapps.com/api/chatbot/chat";
      websocket = new WebSocket(url);

      websocket.addEventListener("open", () => {
        websocket.send(
          JSON.stringify({
            chatId: chatId,
            appId: "professor-decide",
            systemPrompt: systemPrompt,
            message: initChat ? "Welcome to SandeshGPT." : message,
          })
        );
      });

      const messageElement = createMessageElement("", "left");
      chatbox.appendChild(messageElement);

      websocket.onmessage = (event) => {
        messageElement.textContent += event.data;
        chatbox.scrollTop = chatbox.scrollHeight;
      };

      websocket.onclose = (event) => {
        receiving = false;
        sendButton.textContent = "Send";
        if (event.code !== 1000) {
          messageElement.textContent += "\n(Error: Try again)";
        }
      };
    }

    function createWelcomeMessage() {
      connectWebSocket("", true);
    }

    sendButton.addEventListener("click", () => {
      if (!receiving && messageInput.value.trim() !== "") {
        const messageText = messageInput.value.trim();
        messageInput.value = "";
        const messageElement = createMessageElement(messageText, "right");
        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight;

        connectWebSocket(messageText, false);
      } else if (receiving && websocket) {
        websocket.close(1000);
      }
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !receiving && messageInput.value.trim() !== "") {
        event.preventDefault();
        sendButton.click();
      }
    });

    clearButton.addEventListener("click", () => {
      chatbox.innerHTML = "";
    });

    // Run welcome message when chat loads
    setTimeout(createWelcomeMessage, 3500);
  </script>
</body>
</html>
